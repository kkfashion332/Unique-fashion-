<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unique Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .content-padding { padding-bottom: 90px; }
        .size-radio:checked + label {
            background-color: #eab308;
            color: #fff;
            border-color: #eab308;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }

        /* --- FLIPKART STYLE ANIMATIONS --- */
        .strike-anim {
            position: relative;
            display: inline-block;
            color: #878787;
        }
        .strike-anim::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1.5px;
            background-color: #878787;
            transform-origin: left;
            animation: strikethrough 0.6s ease-out forwards;
        }
        @keyframes strikethrough {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        .discount-text {
            color: #16a34a;
            animation: pulseText 1.2s infinite alternate ease-in-out;
        }
        @keyframes pulseText {
            0% { transform: scale(1); text-shadow: 0 0 0 rgba(22, 163, 74, 0); }
            100% { transform: scale(1.02); text-shadow: 0 0 4px rgba(22, 163, 74, 0.3); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Top Navbar -->
    <nav id="topNav" class="bg-[#0a0a0a] py-2.5 px-3 flex justify-between items-center sticky top-0 z-50 shadow-md border-b-[1.5px] border-yellow-500 rounded-b-[1.5rem]">
        <div class="flex items-center w-full justify-between relative px-1">
            <div class="flex-shrink-0 z-10">
                <img id="secretLogo" src="logo.png" onerror="this.src='https://ui-avatars.com/api/?name=UF&background=000&color=D4AF37'" alt="Unique Fashion" class="h-10 w-auto max-w-[80px] cursor-pointer object-contain drop-shadow-[0_0_8px_rgba(212,175,55,0.5)]">
            </div>
            
            <div class="flex flex-col items-center justify-center cursor-pointer absolute left-1/2 transform -translate-x-1/2" onclick="goHome()">
                <span class="font-black text-[20px] tracking-[0.08em] text-white leading-none mt-0.5 whitespace-nowrap">UNIQUE FASHION</span>
                <div class="flex items-center gap-1.5 mt-1 w-full justify-center opacity-90">
                    <div class="w-5 h-[1px] bg-yellow-500"></div>
                    <span class="text-[6.5px] tracking-[0.2em] text-yellow-500 uppercase whitespace-nowrap font-bold">Style Your Story</span>
                    <div class="w-5 h-[1px] bg-yellow-500"></div>
                </div>
            </div>

            <div class="flex items-center gap-4 text-white text-[18px] flex-shrink-0 z-10">
                <div class="relative cursor-pointer hover:text-yellow-500 transition drop-shadow-md" onclick="showCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="topCartBadge" class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden border border-black shadow-sm">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main App Container -->
    <div id="app" class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl content-padding relative">
        <div class="min-h-screen flex flex-col items-center justify-center text-yellow-500">
            <i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i>
            <p class="font-bold tracking-widest text-gray-800">LOADING STORE...</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Updated: New Collection & Orders Replaced Profile) -->
    <div id="bottomNav" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-2 max-w-md mx-auto z-[60] flex justify-around items-center h-16 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
        <div onclick="showLikes()" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-heart text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Likes</span></div>
        <div onclick="showNewCollection()" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-clock-rotate-left text-[20px]"></i><span class="text-[9px] mt-1 font-bold">New Arrival</span></div>
        <div class="w-1/5 flex justify-center relative">
            <div onclick="goHome()" class="absolute -top-10 w-14 h-14 bg-gradient-to-r from-yellow-500 to-yellow-400 rounded-full flex items-center justify-center text-white text-2xl shadow-[0_0_15px_rgba(212,175,55,0.4)] border-[3px] border-white cursor-pointer z-50 transition-transform active:scale-95"><i class="fa-solid fa-house drop-shadow-md"></i></div>
        </div>
        <div onclick="showCart()" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer relative transition-colors"><i class="fa-solid fa-cart-shopping text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Cart</span><span id="bottomCartCount" class="absolute -top-1 right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden border border-white">0</span></div>
        <div onclick="showMyOrders()" class="flex flex-col items-center w-1/5 text-gray-400 hover:text-yellow-500 cursor-pointer transition-colors"><i class="fa-solid fa-box text-[20px]"></i><span class="text-[9px] mt-1 font-bold">Orders</span></div>
    </div>

    <div id="imageModalContainer"></div>

    <script>
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyASPAURqgDQWu-jQaj5_tPjuIhZNtWzUqo",
            authDomain: "ai-calling-agent-7caac.firebaseapp.com",
            databaseURL: "https://ai-calling-agent-7caac-default-rtdb.firebaseio.com",
            projectId: "ai-calling-agent-7caac",
            storageBucket: "ai-calling-agent-7caac.firebasestorage.app",
            messagingSenderId: "414705823578",
            appId: "1:414705823578:web:d7d84cd62dc04bcffd8d63"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.error("Firebase init failed:", e);
        }

        // --- DYNAMIC DATA STATE ---
        let categories = []; 
        let products = [];
        let banners = [];
        let paymentSettings = { qr_url: "", upi_id: "", whatsapp: "919999999999" };
        
        let cart = JSON.parse(localStorage.getItem('uf_cart')) || [];
        let likedItems = JSON.parse(localStorage.getItem('uf_likes')) || [];
        let activeCategory = ""; 
        let tempCheckoutData = null; 
        
        let currentSelectedSize = null; 
        let currentComboSize1 = null; 
        let currentComboSize2 = null; 
        
        const appDiv = document.getElementById('app');

        // --- SMART NAVIGATION & BACK BUTTON LOGIC ---
        let isNavigatingBack = false;

        function pushHistory(page, param = null) {
            if (isNavigatingBack) return;
            const stateObj = { page, param };
            const hashUrl = `#${page}${param ? '-' + param : ''}`;
            if (history.state && history.state.page === page && history.state.param === param) return;
            history.pushState(stateObj, '', hashUrl);
        }

        window.addEventListener('popstate', (event) => {
            isNavigatingBack = true;
            if (event.state) {
                const { page, param } = event.state;
                if(page === 'home') _goHome();
                else if(page === 'product') _viewProduct(param);
                else if(page === 'cart') _showCart();
                else if(page === 'likes') _showLikes();
                else if(page === 'orders') _showMyOrders();
                else if(page === 'new_collection') _showNewCollection();
                else if(page === 'address') _goToAddress(param);
                else if(page === 'payment') _renderPaymentScreen();
            } else {
                _goHome();
            }
            setTimeout(() => { isNavigatingBack = false; }, 100);
        });

        // --- REALTIME DATABASE SYNC WITH 24-HOUR CACHE ---
        async function initApp() {
            if (!db) {
                appDiv.innerHTML = `<div class="text-center mt-20 text-red-500 font-bold">Database Connection Error.</div>`;
                return;
            }

            try {
                const CACHE_KEY = 'uf_data_cache';
                const CACHE_EXPIRY_KEY = 'uf_data_cache_expiry';
                const CACHE_TIME = 24 * 60 * 60 * 1000; 
                const now = Date.now();
                
                const expiry = localStorage.getItem(CACHE_EXPIRY_KEY);
                const cachedData = localStorage.getItem(CACHE_KEY);

                if (cachedData && expiry && now < parseInt(expiry)) {
                    const parsedData = JSON.parse(cachedData);
                    categories = parsedData.categories || [];
                    products = parsedData.products || [];
                    banners = parsedData.banners || [];
                    if(parsedData.paymentSettings) paymentSettings = parsedData.paymentSettings;
                } else {
                    const setupCheck = await db.ref('settings/payment').once('value');
                    if (!setupCheck.exists()) await seedInitialData();

                    const catSnap = await db.ref('categories').once('value');
                    if(catSnap.exists()) {
                        categories = []; 
                        catSnap.forEach(child => { if(child.val() && typeof child.val() === 'object') categories.push(child.val()); });
                    }

                    const pSnap = await db.ref('products').once('value');
                    if(pSnap.exists()) {
                        products = [];
                        pSnap.forEach(child => { if(child.val() && typeof child.val() === 'object') products.push(child.val()); });
                    }

                    const bSnap = await db.ref('banners').once('value');
                    if(bSnap.exists()) {
                        banners = [];
                        bSnap.forEach(child => { if(child.val() && typeof child.val() === 'object') banners.push(child.val()); });
                    }

                    const paySnap = await db.ref('settings/payment').once('value');
                    if(paySnap.exists()) paymentSettings = paySnap.val();

                    const dataToCache = { categories, products, banners, paymentSettings };
                    localStorage.setItem(CACHE_KEY, JSON.stringify(dataToCache));
                    localStorage.setItem(CACHE_EXPIRY_KEY, (now + CACHE_TIME).toString());
                }

                if (!history.state) {
                    history.replaceState({ page: 'home', param: null }, '', '#home');
                }
                
                _goHome();
                updateCartBadge();
            } catch (error) {
                appDiv.innerHTML = `<div class="text-center mt-20 text-red-500 font-bold">Network Error.</div>`;
            }
        }

        async function seedInitialData() {
            await db.ref('settings/payment').set({ qr_url: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=dummy@upi&pn=UNIQUEFASHION", upi_id: "dummy@upi", whatsapp: "919999999999" });
            await db.ref('banners').set({ b1: { id: "b1", img: "https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=800&q=80", target_link: "#" } });
            await db.ref('categories').set({ c1: { id: "c1", name: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=150&q=80" }, c2: { id: "c2", name: "Jeans", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=150&q=80" }});
            await db.ref('products').set({ 
                p1: { id: "p1", name: "Premium Black T-Shirt", price: 499, mrp: 999, discount: "50% OFF", category: "T-Shirts", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80", shirtSizes: "S, M, L, XL, XXL", jeansSizes: "" }
            });
        }

        // --- ROUTE WRAPPERS ---
        function goHome() { pushHistory('home'); _goHome(); }
        function showLikes() { pushHistory('likes'); _showLikes(); }
        function showMyOrders() { pushHistory('orders'); _showMyOrders(); }
        function showNewCollection() { pushHistory('new_collection'); _showNewCollection(); }
        function showCart() { pushHistory('cart'); _showCart(); }
        function viewProduct(id) { pushHistory('product', id); _viewProduct(id); }
        function goToAddress(source) { pushHistory('address', source); _goToAddress(source); }
        function goToPaymentScreen() { pushHistory('payment'); _renderPaymentScreen(); }

        // --- VIEWS ---

        // 1. HOME PAGE (2 Columns Grid Restored)
        function _goHome() {
            let displayProducts = products;
            if(activeCategory !== "") {
                displayProducts = products.filter(p => p.category === activeCategory);
            }

            let catHTML = categories.map(cat => `
                <div onclick="filterCategory('${cat.name}')" class="flex flex-col items-center gap-1.5 cursor-pointer w-full">
                    <div class="w-14 h-14 rounded-full overflow-hidden border-[2.5px] ${activeCategory === cat.name ? 'border-yellow-500 shadow-md scale-105' : 'border-gray-200'} transition-all mx-auto flex-shrink-0 bg-white">
                        <img src="${cat.img}" class="w-full h-full object-cover">
                    </div>
                    <span class="text-[9px] md:text-[10px] ${activeCategory === cat.name ? 'text-yellow-600 font-extrabold' : 'text-gray-600 font-bold'} text-center w-full uppercase break-words line-clamp-2 leading-tight">${cat.name}</span>
                </div>
            `).join('');
            
            // 2 COLUMNS PRODUCT GRID
            let prodHTML = displayProducts.map(item => {
                const isLiked = likedItems.includes(item.id);
                const discountVal = item.discount ? String(item.discount).replace(/OFF/gi, '').trim() : '';
                
                return `
                <div class="bg-white border border-gray-200 rounded-xl shadow-[0_4px_10px_rgba(0,0,0,0.04)] relative flex flex-col justify-between overflow-hidden group">
                    <button onclick="event.stopPropagation(); toggleLike(this, '${item.id}')" class="absolute top-2 right-2 ${isLiked ? 'text-red-500' : 'text-gray-300'} z-10 text-xl bg-white/80 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm shadow-sm transition-colors hover:scale-110">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <div onclick="viewProduct('${item.id}')" class="cursor-pointer relative overflow-hidden">
                        <img src="${item.img}" class="w-full h-44 object-cover transform group-hover:scale-105 transition duration-500">
                    </div>
                    <div class="p-3 flex flex-col flex-grow border-t border-gray-100">
                        <h3 onclick="viewProduct('${item.id}')" class="text-sm font-bold truncate text-gray-800 cursor-pointer">${item.name}</h3>
                        
                        <div class="mt-2 flex items-center gap-1.5">
                            <span class="discount-text text-[10px] font-extrabold flex items-center tracking-tight"><i class="fa-solid fa-arrow-down text-[8px] mr-0.5"></i>${discountVal}</span>
                            <span class="text-gray-400 font-bold text-[10px] strike-anim tracking-tight">₹${item.mrp}</span>
                            <span class="font-black text-gray-900 text-[16px] tracking-tight">₹${item.price}</span>
                        </div>
                        
                        <div class="flex justify-between gap-1.5 mt-3">
                            <button onclick="event.stopPropagation(); viewProduct('${item.id}')" class="flex-1 bg-white border border-yellow-500 text-yellow-600 font-bold py-1.5 rounded-[6px] text-[9px] shadow-sm flex items-center justify-center gap-1">CART</button>
                            <button onclick="event.stopPropagation(); handleBuyNow('${item.id}')" class="flex-1 bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-extrabold py-1.5 rounded-[6px] shadow-sm text-[9px]">BUY NOW</button>
                        </div>
                    </div>
                </div>
            `}).join('');

            if(displayProducts.length === 0) { prodHTML = `<div class="col-span-2 text-center text-gray-500 py-10 font-semibold">No products found.</div>`; }

            let bannerHTML = banners.map(b => `
                <a href="${b.target_link || '#'}" class="min-w-full flex-shrink-0 snap-center relative h-60 block">
                    <img src="${b.img}" class="w-full h-full object-cover">
                </a>
            `).join('');

            appDiv.innerHTML = `
                <div id="homeView" class="fade-in bg-gray-50 min-h-screen pb-6">
                    <div id="bannerSlider" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar relative shadow-sm" style="scroll-behavior: smooth;">
                        ${bannerHTML}
                    </div>
                    <div class="grid grid-cols-5 gap-y-4 gap-x-2 py-5 px-3 bg-white border-b border-gray-200 justify-items-center items-start shadow-sm mb-2 rounded-b-2xl">
                        ${catHTML}
                    </div>
                    
                    <div class="p-4 bg-gray-50 rounded-t-2xl">
                        <div class="flex items-center gap-3 mb-4 mt-2 ml-1">
                            <div class="w-1.5 h-5 bg-yellow-500 rounded"></div>
                            <h2 class="font-extrabold text-base text-gray-900 tracking-wider uppercase">${activeCategory !== "" ? activeCategory : "LATEST COLLECTION"}</h2>
                        </div>
                        <!-- 2 Columns Grid -->
                        <div class="grid grid-cols-2 gap-4">
                            ${prodHTML}
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function filterCategory(catName) {
            if(activeCategory === catName) activeCategory = "";
            else activeCategory = catName;
            goHome();
        }

        // 2. NEW COLLECTION TIMELINE VIEW (1 Big Image per row with Timeline)
        function _showNewCollection() {
            let timelineHTML = banners.map((b, index) => `
                <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm relative mb-6">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Arrival #${index + 1}</span>
                    </div>
                    <div class="rounded-xl overflow-hidden shadow-md">
                        <img src="${b.img}" class="w-full h-72 object-cover">
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                        <span class="text-xs font-bold text-yellow-600 bg-yellow-50 px-2.5 py-1 rounded-md">New Drop</span>
                        <button onclick="goHome()" class="text-xs font-bold text-gray-700 bg-gray-100 px-3 py-1.5 rounded-md hover:bg-yellow-500 hover:text-white transition">Shop Now</button>
                    </div>
                </div>
            `).join('');

            if(banners.length === 0) {
                timelineHTML = `<div class="text-center p-10 text-gray-500 font-semibold">No new arrivals right now.</div>`;
            }

            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-24 bg-gray-50 min-h-screen">
                    <button onclick="history.back()" class="mb-4 text-gray-600 text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex items-center gap-2 mb-6 border-b border-gray-200 pb-3">
                        <div class="w-1.5 h-6 bg-yellow-500 rounded"></div>
                        <h1 class="text-xl font-extrabold text-gray-800 uppercase tracking-wide">New Collection Timeline</h1>
                    </div>
                    ${timelineHTML}
                </div>
            `;
            window.scrollTo(0,0);
        }

        // 3. LIKES PAGE
        function toggleLike(btn, id) {
            const index = likedItems.indexOf(id);
            if (index > -1) {
                likedItems.splice(index, 1);
                btn.classList.remove('text-red-500'); btn.classList.add('text-gray-300');
            } else {
                likedItems.push(id);
                btn.classList.remove('text-gray-300'); btn.classList.add('text-red-500');
            }
            localStorage.setItem('uf_likes', JSON.stringify(likedItems));
        }

        function _showLikes() {
            let likedProducts = products.filter(p => likedItems.includes(p.id));
            let html = "";

            if (likedProducts.length === 0) {
                html = `<div class="text-center p-10 mt-10"><i class="fa-solid fa-heart-crack text-5xl text-gray-300 mb-4"></i><h2 class="text-gray-600 font-bold text-lg">No Liked Items</h2><button onclick="history.back()" class="mt-6 bg-white border border-yellow-500 text-yellow-600 px-6 py-2 rounded-lg font-bold shadow-sm">Explore Collection</button></div>`;
            } else {
                html = `<div class="grid grid-cols-2 gap-4">` + likedProducts.map(item => {
                    const discountVal = item.discount ? String(item.discount).replace(/OFF/gi, '').trim() : '';
                    return `
                    <div class="bg-white border border-gray-200 rounded-xl shadow-[0_4px_10px_rgba(0,0,0,0.04)] relative flex flex-col justify-between overflow-hidden group">
                        <button onclick="event.stopPropagation(); toggleLike(this, '${item.id}'); setTimeout(_showLikes, 300);" class="absolute top-2 right-2 text-red-500 z-10 text-xl bg-white/80 rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-sm shadow-sm transition-colors hover:scale-110"><i class="fa-solid fa-heart"></i></button>
                        <div onclick="viewProduct('${item.id}')" class="cursor-pointer relative overflow-hidden"><img src="${item.img}" class="w-full h-44 object-cover transform group-hover:scale-105 transition duration-500"></div>
                        <div class="p-3 flex flex-col flex-grow border-t border-gray-100">
                            <h3 class="text-sm font-bold truncate text-gray-800">${item.name}</h3>
                            <div class="mt-2 flex items-center gap-1.5">
                                <span class="discount-text text-[10px] font-extrabold flex items-center tracking-tight"><i class="fa-solid fa-arrow-down text-[8px] mr-0.5"></i>${discountVal}</span>
                                <span class="text-gray-400 font-bold text-[10px] strike-anim tracking-tight">₹${item.mrp}</span>
                                <span class="font-black text-gray-900 text-[16px] tracking-tight">₹${item.price}</span>
                            </div>
                            <div class="flex justify-between gap-1.5 mt-3">
                                <button onclick="event.stopPropagation(); viewProduct('${item.id}')" class="flex-1 bg-white border border-yellow-500 text-yellow-600 font-bold py-1.5 rounded-[6px] text-[9px] shadow-sm flex items-center justify-center gap-1">CART</button>
                                <button onclick="event.stopPropagation(); handleBuyNow('${item.id}')" class="flex-1 bg-gradient-to-r from-yellow-500 to-yellow-400 text-white font-extrabold py-1.5 rounded-[6px] shadow-sm text-[9px]">BUY NOW</button>
                            </div>
                        </div>
                    </div>
                `}).join('') + `</div>`;
            }

            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-24 bg-gray-50 min-h-screen">
                    <button onclick="history.back()" class="mb-4 text-gray-600 text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex items-center gap-2 mb-6 border-b border-gray-200 pb-3">
                        <div class="w-1.5 h-6 bg-red-500 rounded"></div>
                        <h1 class="text-xl font-extrabold text-gray-800 uppercase tracking-wide">My Likes</h1>
                    </div>
                    ${html}
                </div>
            `;
            window.scrollTo(0,0);
        }

        // 4. ORDERS LOOKUP PAGE (Customer enters phone number to check orders)
        function _showMyOrders() {
            appDiv.innerHTML = `
                <div class="fade-in p-5 pb-24 bg-gray-50 min-h-screen">
                    <button onclick="history.back()" class="mb-4 text-gray-600 text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="flex items-center gap-2 mb-6 border-b border-gray-200 pb-3">
                        <div class="w-1.5 h-6 bg-yellow-500 rounded"></div>
                        <h1 class="text-xl font-extrabold text-gray-800 uppercase tracking-wide">Track Orders</h1>
                    </div>

        function fetchOrdersByPhone() {
            const phone = document.getElementById('trackPhone').value.trim();
            const container = document.getElementById('orderListContainer');
            if(phone.length < 10) { alert("Please enter a valid phone number!"); return; }

            container.innerHTML = `<div class="text-center text-yellow-600 font-bold py-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Searching orders...</div>`;

            db.ref('orders').orderByChild('phone').equalTo(phone).once('value').then(snapshot => {
                let userOrders = []; snapshot.forEach(child => userOrders.push(child.val()));
                userOrders.sort((a, b) => b.id - a.id);
                
                if (userOrders.length === 0) {
                    container.innerHTML = `<div class="text-center p-8 bg-white rounded-xl border border-gray-200 text-gray-500 font-semibold">No orders found for this number.</div>`;
                    return;
                }

                container.innerHTML = userOrders.map(order => {
                    let tokenAmount = order.payment === "COD" ? Math.round(order.price * 0.30) : order.price;
                    let remainingAmount = order.payment === "COD" ? order.price - tokenAmount : 0;
                    let payInfo = order.payment === "COD" ? `Paid Token: ₹${tokenAmount} | To Pay on Delivery: ₹${remainingAmount}` : `Paid Full: ₹${order.price}`;

                    let itemsHTML = order.items ? order.items.map(i => `<div class="flex gap-2 items-center text-xs mt-1"><img src="${i.img}" class="w-10 h-10 object-cover rounded"><span>${i.name} (Size: ${i.size}) - ₹${i.price}</span></div>`).join('') : '';

                    return `
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm mb-4">
                            <div class="flex justify-between items-center border-b border-gray-100 pb-2 mb-2">
                                <span class="text-xs font-bold text-gray-500">ID: ${order.id}</span>
                                <span class="text-[10px] font-extrabold px-2 py-0.5 bg-yellow-50 text-yellow-700 rounded border border-yellow-200">${order.status || 'Pending Verification'}</span>
                            </div>

                            <p class="text-xs font-bold text-gray-700 mt-3"><i class="fa-solid fa-wallet text-yellow-500 mr-1"></i> ${payInfo}</p>
                            <p class="text-[11px] text-gray-500 mt-1"><i class="fa-solid fa-location-dot text-yellow-500 mr-1"></i> ${order.address}</p>
                        </div>
                    `;
                }).join('');
            });
        }

                                <span class="text-gray-400 font-bold text-lg strike-anim tracking-tight">₹${product.mrp}</span>
                                <span class="font-black text-gray-900 text-3xl ml-1 tracking-tight">₹${product.price}</span>

        function getValidatedSize(product) {
            let hasShirt = !!product.shirtSizes && product.shirtSizes.trim() !== "";
            let hasJeans = !!product.jeansSizes && product.jeansSizes.trim() !== "";
            if (hasShirt && hasJeans) {
                if(!currentComboSize1 || !currentComboSize2) return null;
                return `Top: ${currentComboSize1}, Bottom: ${currentComboSize2}`;
            } else if (hasShirt) {
                if(!currentComboSize1) return null;
                return currentComboSize1;
            } else if (hasJeans) {
                if(!currentComboSize2) return null;
                return currentComboSize2;
            } else {
                if(!currentSelectedSize) return null;
                return currentSelectedSize;
            }
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const finalSize = getValidatedSize(product);
            if(!finalSize) { alert("Please select required sizes first!"); return; }

            cart.push({ ...product, size: finalSize, cartId: Date.now() });
            localStorage.setItem('uf_cart', JSON.stringify(cart));
            updateCartBadge();
            
            const btn = document.getElementById(`addBtn-${id}`);
            if(btn) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> ADDED';
                setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-cart-plus mr-1"></i> ADD TO CART'; }, 1500);
            }
        }

        function handleBuyNow(id) {
            const product = products.find(p => p.id === id);
            const finalSize = getValidatedSize(product);
            if(!finalSize) { alert("Please select required sizes first!"); return; }
            currentSelectedSize = finalSize; 
            goToAddress(id);
        }

        function removeFromCart(index) { 
            cart.splice(index, 1); 
            localStorage.setItem('uf_cart', JSON.stringify(cart));
            updateCartBadge(); 
            _showCart(); 
        }

        function updateCartBadge() {
            const b1 = document.getElementById('bottomCartCount');
            const b2 = document.getElementById('topCartBadge');
            if (cart.length > 0) { 
                if(b1) { b1.innerText = cart.length; b1.classList.remove('hidden'); }
                if(b2) { b2.innerText = cart.length; b2.classList.remove('hidden'); }
            } else { 
                if(b1) b1.classList.add('hidden'); 
                if(b2) b2.classList.add('hidden'); 
            }
        }

        async function fetchPinCodeDetails(pincode) {
            const statusEl = document.getElementById('pinStatus');
            const districtEl = document.getElementById('custDistrict');
            const stateEl = document.getElementById('custState');
            const villageEl = document.getElementById('custVillage');
            
            if (pincode.length === 6) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';
                try {
                    let response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    let data = await response.json();
                    if (data[0].Status === "Success") {
                        let postOffices = data[0].PostOffice;
                        districtEl.value = postOffices[0].District;
                        stateEl.value = postOffices[0].State;
                        villageEl.value = postOffices[0].Name;
                        statusEl.innerHTML = '<i class="fa-solid fa-check text-green-600"></i> Found';
                    } else {
                        statusEl.innerHTML = '<span class="text-red-500">Type manually</span>';
                    }
                } catch (e) {
                    statusEl.innerHTML = '<span class="text-red-500">Error</span>';
                }
            } else {
                statusEl.innerHTML = ''; 
            }
        }

                    <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg mb-4 text-center shadow-sm">
                        <p class="text-[11px] text-yellow-700 font-bold">For C.O.D, 30% advance token is required.</p>
                        <p class="font-black text-xl text-gray-900 mt-1">Token: ₹${tokenAmount}</p>
                    </div>
                    <div class="flex justify-center mb-5"><img src="${qrUrl}" class="w-36 h-36 border-4 border-gray-100 rounded-xl p-1 bg-white shadow-sm"></div>
                    <div class="bg-red-50 border border-red-200 p-3 rounded-lg mb-2">
                        <p class="text-[11px] text-center text-red-600 font-bold">⚠️ Send token screenshot on next screen.</p>
                    </div>
                `;
            }
        }

        async function confirmOrder(event) {
            event.preventDefault();
            const paymentType = document.getElementById('cod').checked ? "COD" : "Prepaid";
            const newOrder = {
                id: Date.now().toString(), date: new Date().toLocaleString(),
                name: tempCheckoutData.name, phone: tempCheckoutData.phone,
                address: tempCheckoutData.address, payment: paymentType,
                product_name: tempCheckoutData.names, price: tempCheckoutData.price,
                img: tempCheckoutData.img, items: tempCheckoutData.items, 
                status: "Pending Verification" 
            };
            appDiv.innerHTML = `<div class="min-h-[70vh] flex flex-col items-center justify-center text-yellow-500 bg-gray-50"><i class="fa-solid fa-spinner fa-spin text-5xl mb-4"></i><p class="font-bold tracking-widest text-gray-800">PLACING ORDER...</p></div>`;
            window.scrollTo(0,0);
            try {
                await db.ref('orders/' + newOrder.id).set(newOrder);
                cart = []; localStorage.setItem('uf_cart', JSON.stringify(cart)); updateCartBadge();
                
                const waNum = paymentSettings.whatsapp;
                const waText = encodeURIComponent(`Hello Unique Fashion, here is my payment screenshot for Order ID: ${newOrder.id}`);

                history.replaceState({ page: 'home', param: null }, '', '#home');

                appDiv.innerHTML = `
                    <div class="fade-in flex flex-col items-center justify-center min-h-screen bg-gray-50 p-5 text-center pb-24">
                        <div class="w-20 h-20 bg-white border-[3px] border-yellow-500 text-yellow-500 rounded-full flex items-center justify-center text-4xl mb-5 shadow-lg"><i class="fa-solid fa-clock"></i></div>
                        <h1 class="text-2xl font-extrabold text-gray-900 uppercase">Verification Pending!</h1>
                        <p class="text-gray-500 mt-2 text-sm font-medium">Thank you, <span class="text-gray-800 font-bold">${tempCheckoutData.name}</span>.</p>
                        <p class="text-gray-500 mt-1 text-sm font-medium">Order ID: <b class="text-gray-900 text-xs">${newOrder.id}</b></p>
                        
                        <div class="bg-white border-2 border-red-100 p-5 rounded-xl mt-6 mb-6 w-full max-w-sm shadow-md">
                            <p class="text-sm text-red-500 font-extrabold mb-4 leading-snug">⚠️ Order will NOT be dispatched until payment screenshot is received.</p>
                            <a href="https://wa.me/${waNum}?text=${waText}" target="_blank" class="flex w-full items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-md animate-pulse transition">
                                <i class="fa-brands fa-whatsapp text-2xl"></i> SEND SCREENSHOT NOW
                            </a>
                        </div>
                        <button onclick="goHome()" class="mt-4 bg-white border border-gray-300 text-gray-700 px-8 py-3.5 rounded-xl font-extrabold shadow-sm w-full max-w-xs uppercase text-sm">Continue Shopping</button>
                    </div>
                `;
            } catch (error) { alert("Database Error!"); goHome(); }
        }

        // Init App 
        initApp();
    </script>
</body>
</html>
